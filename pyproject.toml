[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "good-neighbor-recovery"
version = "0.1.0"
description = "Safe, failure-aware surplus-food recovery agent system"
requires-python = ">=3.11"
dependencies = [
    "bedrock-agentcore==1.21.0",
    "strands-agents==1.52.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
good-neighbor-demo = "good_neighbor.demo_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
good_neighbor = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
